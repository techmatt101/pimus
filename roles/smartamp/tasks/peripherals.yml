---
# PyUSB needs direct access to the XVF3800 vendor-control endpoint for LEDs and
# direction-of-arrival data. Grant only the plugdev group instead of running the
# controller as root.
- name: Install ReSpeaker USB permissions
  ansible.builtin.copy:
    dest: /etc/udev/rules.d/60-smartamp-respeaker.rules
    content: |
      SUBSYSTEM=="usb", ATTR{idVendor}=="2886", ATTR{idProduct}=="001a", MODE:="0660", GROUP="plugdev"
    owner: root
    group: root
    mode: "0644"
  notify: Reload udev
  when: respeaker_led_enabled | bool

# Convert the human-editable Ansible state/colour map into the local controller
# format while keeping it readable by the restricted service account.
- name: Install ReSpeaker peripheral configuration
  ansible.builtin.template:
    src: peripherals.yml.j2
    dest: "{{ smartamp_config_dir }}/peripherals.yml"
    owner: root
    group: "{{ smartamp_service_user }}"
    mode: "0640"
  notify: Restart peripherals
  when: respeaker_led_enabled | bool

# This bridge combines LVA voice state, HA light commands, and XVF3800 USB LED
# controls; the voice client itself remains hardware-agnostic.
- name: Install ReSpeaker peripheral controller
  ansible.builtin.copy:
    src: peripheral.py
    dest: "{{ smartamp_app_dir }}/peripheral.py"
    owner: root
    group: root
    mode: "0755"
  notify: Restart peripherals
  when: respeaker_led_enabled | bool

# A dedicated service can reconnect automatically when either the ReSpeaker or
# LVA WebSocket is temporarily unavailable.
- name: Install ReSpeaker peripheral service
  ansible.builtin.template:
    src: smartamp-peripherals.service.j2
    dest: /etc/systemd/system/smartamp-peripherals.service
    owner: root
    group: root
    mode: "0644"
  notify:
    - Reload systemd
    - Restart peripherals
  when: respeaker_led_enabled | bool

- name: Enable ReSpeaker peripheral service
  ansible.builtin.systemd_service:
    name: smartamp-peripherals.service
    enabled: true
  when: respeaker_led_enabled | bool

# Clean up active state when a feature is switched off on a later Ansible run.
- name: Disable ReSpeaker peripheral service when disabled
  ansible.builtin.systemd_service:
    name: smartamp-peripherals.service
    enabled: false
    state: stopped
  failed_when: false
  when: not (respeaker_led_enabled | bool)

# Stream Deck+ is exposed as hidraw. Group-scoped access lets the local Node
# process control it without broad root privileges.
- name: Install Stream Deck USB permissions
  ansible.builtin.copy:
    dest: /etc/udev/rules.d/60-smartamp-streamdeck.rules
    content: |
      KERNEL=="hidraw*", ATTRS{idVendor}=="0fd9", MODE:="0660", GROUP="plugdev"
    owner: root
    group: root
    mode: "0644"
  notify: Reload udev
  when: streamdeck_enabled | bool

# Keep the Node application and its dependency tree together under /opt rather
# than installing project-specific npm packages globally.
- name: Create Stream Deck application directory
  ansible.builtin.file:
    path: "{{ smartamp_app_dir }}/streamdeck"
    state: directory
    owner: root
    group: root
    mode: "0755"
  when: streamdeck_enabled | bool

# package.json pins the USB/HID and WebSocket libraries for repeatable rebuilds.
# Its change status tells the following npm task when dependencies may differ.
- name: Install Stream Deck application manifest
  ansible.builtin.copy:
    src: streamdeck/package.json
    dest: "{{ smartamp_app_dir }}/streamdeck/package.json"
    owner: root
    group: root
    mode: "0644"
  register: streamdeck_package
  when: streamdeck_enabled | bool

# Omit development tooling, audit traffic, and funding prompts to keep the
# headless runtime install smaller and deterministic in automation logs.
- name: Install Stream Deck application dependencies
  ansible.builtin.command: npm install --omit=dev --no-audit --no-fund
  args:
    chdir: "{{ smartamp_app_dir }}/streamdeck"
  register: streamdeck_npm
  changed_when: >-
    'added ' in streamdeck_npm.stdout or
    'removed ' in streamdeck_npm.stdout or
    'changed ' in streamdeck_npm.stdout
  when: streamdeck_enabled | bool
  notify: Restart streamdeck

# The controller renders keys/touch strip locally and maps presses/dials to LVA,
# audio-route, LED, or optional HA webhook actions.
- name: Install Stream Deck controller
  ansible.builtin.copy:
    src: streamdeck/index.mjs
    dest: "{{ smartamp_app_dir }}/streamdeck/index.mjs"
    owner: root
    group: root
    mode: "0644"
  notify: Restart streamdeck
  when: streamdeck_enabled | bool

# Generate the physical layout from inventory variables so labels and actions
# can be customised without editing JavaScript.
- name: Install Stream Deck configuration
  ansible.builtin.template:
    src: streamdeck.json.j2
    dest: "{{ smartamp_config_dir }}/streamdeck.json"
    owner: root
    group: "{{ smartamp_service_user }}"
    mode: "0640"
  notify: Restart streamdeck
  when: streamdeck_enabled | bool

# systemd starts the controller without a desktop session and reconnects after
# USB resets or transient failures.
- name: Install Stream Deck service
  ansible.builtin.template:
    src: smartamp-streamdeck.service.j2
    dest: /etc/systemd/system/smartamp-streamdeck.service
    owner: root
    group: root
    mode: "0644"
  notify:
    - Reload systemd
    - Restart streamdeck
  when: streamdeck_enabled | bool

- name: Enable Stream Deck service
  ansible.builtin.systemd_service:
    name: smartamp-streamdeck.service
    enabled: true
  when: streamdeck_enabled | bool

# Stop an existing controller when its Ansible feature flag is later disabled.
- name: Disable Stream Deck service when disabled
  ansible.builtin.systemd_service:
    name: smartamp-streamdeck.service
    enabled: false
    state: stopped
  failed_when: false
  when: not (streamdeck_enabled | bool)
