---
# Identity
smartamp_hostname: office-amp
smartamp_timezone: Europe/London
smartamp_service_user: smartamp

# SD-card endurance. True keeps systemd logs for the current boot in RAM only;
# false persists them (capped at 64M) so crashes leave evidence. Currently off
# while the USB-gadget crash is being investigated.
smartamp_journal_in_ram: false

# Log verbosity for the controller and audio manager. Debug traces every
# action: deck input, route commands, Home Assistant calls, and each pactl
# invocation. Leave off day-to-day; the traces are chatty by design.
# Currently on, with the persistent journal, for the USB-gadget crash hunt.
smartamp_debug_logging: true
# The stock SD swapfile is removed; memory exhaustion then OOM-kills and
# restarts a service instead of wearing the card. Set to true to restore it.
smartamp_swapfile_enabled: false

# Compressed swap held in RAM (zram), which buys headroom without ever writing
# to the card. This is deliberately not zswap: zswap is a cache in front of a
# real swap device and spills to that device when its pool fills, so it cannot
# give headroom on a Pi with no disk swap. zram has no backing store, so when
# it fills the kernel still OOM-kills and systemd still restarts the service —
# the endurance stance above survives intact. If the swapfile is also enabled,
# the priority below keeps zram preferred and the card used only after it.
smartamp_zram_enabled: true
# Size of the zram device as a percentage of total RAM. This is the
# uncompressed capacity it advertises; the RAM it actually consumes is that
# divided by the compression ratio, roughly 2.5-3x on the controller's and
# audio manager's heaps. Going far above 100 risks the pool itself exhausting
# memory faster than swapping relieves it.
smartamp_zram_percent: 50

# HiFiBerry DAC2 ADC Pro + AAmp60
hifiberry_overlay: hifiberry-dacplusadcpro
hifiberry_card_name: sndrpihifiberry
# The DAC's hardware output ceiling. The ALSA percent scale is logarithmic
# across -103.5..0 dB, about -1 dB per point below 100: 90 is a -10 dB
# ceiling, but 30 is -72.5 dB — inaudible on any speaker. Day-to-day loudness
# comes from the audio manager's music and voice levels (PipeWire), not this;
# with the output sink pinned at 100% this ceiling is the one hard cap above
# those levels.
hifiberry_output_volume_percent: 100
hifiberry_aux_gain_db: 0
hifiberry_aux_input_left: "VINL1[SE]"
hifiberry_aux_input_right: "VINR1[SE]"

# The music level each boot starts at, so every start has the same predictable
# loudness. The output sink itself stays pinned at 100%: this and the voice
# level below are gains the audio manager holds on its bridge streams, and the
# volume dial takes over from here.
smartamp_startup_volume_percent: 30

# PipeWire device matching. These are regular expressions, matched against
# the Pulse/PipeWire node name, description and properties.
smartamp_output_match: "HiFiBerry|snd_rpi_hifiberry|soc_sound"
smartamp_aux_match: "HiFiBerry|snd_rpi_hifiberry|soc_sound"
smartamp_voice_input_match: "reSpeaker.*XVF3800|XVF3800|2886.*001A"
smartamp_aec_reference_match: "reSpeaker.*XVF3800|XVF3800|2886.*001A"
# The XVF3800's USB capture is two DSP outputs, not a stereo pair: channel 0
# carries its Conference stream (post-processed for human listeners) and
# channel 1 its ASR stream (tuned for wake-word and speech recognition). The
# audio manager remaps exactly this one channel into a mono source and makes
# that the default, so the voice assistant hears the ASR stream - capturing
# the device in mono would instead downmix Conference and ASR together. Set to
# null to use the device unmapped (for a genuinely mono microphone).
smartamp_voice_capture_channel: 1
# The kernel's f_uac2 driver always names the local capture card UAC2Gadget,
# independent of usb_audio_product (the host-facing name), so this rarely needs
# changing. Override only if a future kernel renames that card.
smartamp_usb_gadget_match: "UAC2Gadget"
smartamp_aux_enabled: false
# Whether the USB computer-audio route starts enabled on boot. This is only
# the resting position of the deck toggle: the audio manager builds the bridge
# solely while a computer is enumerated on the gadget port, because with no
# host the gadget's capture clock never ticks and would stall the whole output
# graph.
smartamp_usb_enabled: false
# Each music input's own level, as the share of the music volume it plays at:
# 100 leaves it at the music level, 80 plays that input at 80% of wherever the
# dial sits. Use these to balance the inputs against each other - USB
# computers tend to play hotter than Sendspin. The Sendspin trim is held on
# its stream into the background bus, so it applies only while
# smartamp_voice_ducking_enabled is on; the aux and USB trims always apply.
smartamp_sendspin_volume_percent: 100
smartamp_usb_volume_percent: 100
smartamp_aux_volume_percent: 100
# Target buffer depth for every PipeWire loopback bridge the audio manager
# builds (aux, USB, ducking bus, and the AEC reference). Lower tightens sync but
# risks dropouts. PipeWire's stock quantum on the Pi is ~21 ms (48 kHz / 1024),
# so ~20 ms is the practical floor: going lower needs a pipewire.conf.d quantum
# override and on-Pi xrun testing. The USB->speakers path crosses two loopbacks
# when ducking is on, so its delay is roughly double this. The aux line-in is
# the one path monitored live, so it inherits this default but can override it.
smartamp_loopback_latency_ms: 20
smartamp_aux_latency_ms: "{{ smartamp_loopback_latency_ms }}"
smartamp_aec_reference_enabled: true
# With nothing playing for this many seconds, the audio manager unloads its
# persistent loopbacks (the bus bridges, the AEC reference, and the muted aux
# bridge) so the HiFiBerry path and the XVF3800 playback endpoint suspend -
# roughly a watt of idle draw. The null sinks stay, so Sendspin and LVA keep
# their PULSE_SINK targets, and the voice capture path is untouched (the wake
# word keeps hearing). Bridges rebuild within a second of a client stream, a
# voice session opening, or a route toggle; the first ~half second of music
# after a long quiet spell is dropped while the bridge loads. The deck's
# panel sleeping (presence-driven) skips this wait and tears down at once;
# the panel waking rebuilds proactively. 0 keeps every bridge loaded
# permanently, panel asleep or not.
smartamp_idle_teardown_seconds: 180

# Keep background playback audible but quieter while Assist is listening,
# thinking, speaking, announcing, or ringing a timer. Sendspin and the USB
# computer input share this background path; LVA voice playback bypasses it.
smartamp_voice_ducking_enabled: true
smartamp_background_sink_name: smartamp_background
# The share of the music level background audio plays AT while ducked -
# reduced TO this share, not BY it. 15 drops music at 60% to 9% (a strong dip;
# Pulse percentages are perceptual, so 50 sounds roughly half as loud). 100
# leaves it untouched, 0 silences it. It scales only the background bridge
# stream, so the music level itself and what plays after the dip are
# unaffected.
smartamp_voice_duck_volume_percent: 15
# The duration of each fade, applied in both directions: the music takes this
# long to ramp down when Assist starts and this long again to ramp back up
# when it finishes. It is not a delay before or after the dip - ducking always
# starts immediately, in up to ten volume steps spread over this time.
smartamp_voice_duck_fade_ms: 250

# Voice playback (Assist responses, timer chimes, announcements) has its own
# bus and its own volume, fully independent of the music level: LVA plays into
# this sink and the bridge carries the voice gain, so voice speaks at the
# startup percent below whether the music sits at 5% or 80%. Applied once per
# audio manager start; the deck's VOICE VOL tile and the volume dial while
# Assist is live own it from then on. Only mute crosses the two - it lands on
# the output sink and silences music and voice alike.
smartamp_voice_sink_name: smartamp_voice
smartamp_voice_startup_volume_percent: 30

# Make the Pi appear as a 48 kHz 16-bit stereo USB sound card to a computer
# connected to the Pi 5 USB-C port. The AAmp60/DAC stack must power the Pi
# through GPIO. Sample size is bytes per sample: 2 = 16-bit, 3 = 24-bit,
# 4 = 32-bit. Keep it at 2: the dwc2 gadget controller corrupts 3-byte
# samples on its isochronous endpoints, which plays as loud static with the
# audio faintly underneath.
usb_audio_gadget_enabled: true
usb_audio_product: "Office Amp USB"
usb_audio_sample_rate: 48000
usb_audio_sample_size_bytes: 2
# What the GPIO 5V rail can supply, declared to the bootloader EEPROM
# (PSU_MAX_CURRENT) because a GPIO-powered Pi has no USB-PD source to
# negotiate with; without it the firmware assumes a weak supply, warns at
# boot, and caps USB-A output at 600mA. Do not raise to 5000 without
# validating the AAmp60 stack's power budget.
usb_audio_psu_max_current_ma: 3000

# Sendspin, Music Assistant's native player protocol. Leave the URL empty so
# the player advertises itself over mDNS and Music Assistant discovers it, or
# set the server WebSocket URL, e.g. "ws://192.168.1.10:8097/sendspin".
sendspin_enabled: true
sendspin_name: "Office Amp"
sendspin_server_url: ""
# Upstream sendspin-cli release installed into the player's virtual environment.
sendspin_version: "7.5.0"
sendspin_extra_args: ""

# Lightweight Home Assistant voice satellite (ESPHome protocol). This is a
# native client only; Home Assistant and its Assist pipeline run elsewhere.
voice_assistant_enabled: true
# Upstream linux-voice-assistant release tag checked out into the satellite's
# virtual environment, matching how sendspin_version pins its client.
voice_assistant_version: "1.1.14"
voice_assistant_name: "Office Amp Voice"
# Wake and stop words are microWakeWord models bundled with the pinned release.
# v1.1.14 ships: okay_nabu, okay_computer, hey_jarvis, hey_mycroft, hey_luna,
# hey_morgan, hey_home_assistant, choo_choo_homie, alexa, and stop. Custom
# OpenWakeWord models dropped in /var/lib/smartamp/lva/wakewords work by name.
voice_assistant_wake_model: okay_nabu
# The stop model listens for "stop" during a response; "stop" is the only
# bundled one, but any wake model name above is accepted here too.
voice_assistant_stop_model: stop
voice_assistant_mic_volume: 100
voice_assistant_port: 6053
voice_assistant_peripheral_port: 6055
voice_assistant_debug: false

# Whether this unit drives the ReSpeaker LED ring, and how bright it runs in
# this room. Which appearance each voice state shows is compiled into the
# controller and edited in apps/controller/src/voice/led-states.mts, exactly
# as the deck layout is; see docs/configuration.md.
respeaker_led_enabled: true
respeaker_led_brightness: 128 # 0 - 255

# Whether this unit drives a Stream Deck+. The key and dial layout itself is
# compiled into the controller and edited in
# apps/controller/src/streamdeck/layout.mts; see docs/controls.md. Set this to
# false for an LED-only deployment with no deck attached.
streamdeck_enabled: true

# While the amp sleeps (the room empty for five minutes, or the SLEEP key),
# power off the Pi's USB-A ports so the Stream Deck and ReSpeaker go dark -
# about two watts. The wake word is off while the room is empty; presence
# returning or the Pi 5 power button powers everything back within a few
# seconds. The sleep and standby timings themselves are compiled into the
# controller beside the layout (the SLEEP block in streamdeck/layout.mts).
smartamp_sleep_usb_power_off: true

# Home Assistant, for the Stream Deck keys that show and change house state:
# the fan, blinds, PC, scenes, timer, temperature, weather, lights dial, and
# media transport. The controller reads entity state and calls services over
# the WebSocket API.
#
# Setting this URL turns the integration on and makes HOME_ASSISTANT_TOKEN
# required in the Pi's secrets file (see the note at the bottom of this file).
# Leave it empty to run without Home Assistant: those keys stay on the deck and
# draw an unknown state, and nothing else is affected. Which entities the keys
# drive is compiled into apps/controller/src/streamdeck/layout.mts, not set here.
home_assistant_url: "https://home.techmatt101.xyz"

# Remote tiles: a WebSocket server inside the controller that lets another
# computer on the LAN push key faces onto the deck's REMOTE page and receive
# the presses back — see apps/remote-demo for a runnable client. Enabling it
# opens this TCP port on the Pi, so it is off by default and requires
# REMOTE_TILES_TOKEN in the secrets file; the controller refuses to listen
# without one. Pick a long random value.
remote_tiles_enabled: false
remote_tiles_port: 8470

# Secrets are not configured here. Tokens are typed once on the Pi itself, in
# /etc/smartamp/secrets.env, which provisioning reads only to confirm each
# required key has a value and never writes:
#
#   sudo mkdir -p /etc/smartamp
#   sudo nano /etc/smartamp/secrets.env
#
#   HOME_ASSISTANT_TOKEN=...   # profile -> Security -> Long-lived access tokens
#   REMOTE_TILES_TOKEN=...     # only when remote_tiles_enabled is true
#
# systemd loads that file into the controller's environment. Provisioning fails
# with the missing key named if it is absent, so no token can reach this
# repository, the control computer, or Git by accident. Editing a value there
# needs "sudo systemctl restart smartamp-controller" to take effect.
