---
# One entry per amp. The inventory name is the unit's hostname: Ansible sets it
# on the Pi from smartamp_hostname, which follows this name, and ansible_host is
# how this computer reaches the board before that name resolves.
#
# What makes a unit itself - its Raspberry Pi, its HiFiBerry board, whether a
# Stream Deck is attached, what it is called in Home Assistant and Music
# Assistant - lives in inventory/host_vars/<name>.yml. Everything shared by all
# three lives in inventory/group_vars/all.yml.
#
# Every make target runs against all of them; name one with LIMIT to work on a
# single amp, e.g. "make provision LIMIT=kitchen-amp".
all:
  children:
    smartamp:
      hosts:
        # Pi 4 Model B, DAC2 ADC Pro + AAmp60, Stream Deck+, USB sound card.
        office-amp:
          ansible_host: office-amp.local
        # Pi 4 Model B, Amp100, no deck.
        bedroom-amp:
          ansible_host: bedroom-amp.local
        # Pi Zero 2 W, Amp100, no deck, USB devices on a self-powered hub.
        kitchen-amp:
          ansible_host: kitchen-amp.local
      vars:
        # The admin user created by Raspberry Pi Imager on each board.
        ansible_user: matt
