---
# office-amp: Raspberry Pi 4 Model B, HiFiBerry DAC2 ADC Pro with the AAmp60
# add-on amplifier, ReSpeaker XVF3800, and an Elgato Stream Deck+. The reference
# build and the only unit here with a deck, an analogue aux input, or a USB-C
# port given over to being a sound card.
#
# Only what differs from inventory/group_vars/all.yml belongs in this file;
# every setting is explained there.

# The DAC the AAmp60 sits on. Its PCM1863 ADC is the analogue line-in, so this
# is the one unit with an aux route at all.
hifiberry_board: dac2adcpro

# The Stream Deck+ and the names the house knows this amp by.
streamdeck_enabled: true
sendspin_name: "Office Amp"
voice_assistant_name: "Office Amp Voice"

# The desk computer plays into the USB-C port, which means the AAmp60 stack
# feeds the Pi through the GPIO header instead. On a Pi 4B the host cable's
# power line has to be cut as well - this board wires USB-C VBUS onto the same
# 5V rail as the GPIO header, with no PMIC to arbitrate the two supplies - so
# the cable to the desk computer is a data-only one.
usb_audio_gadget_enabled: true
usb_audio_product: "Office Amp USB"

# Cut the rails on halt, for the ~0W floor the deep-sleep automation wants.
# WAKE_ON_GPIO has to stay off to get it: the Pi 4B bootloader ignores
# POWER_OFF_ON_HALT whenever that key is set, because watching GPIO3 means
# leaving the PMIC partly up - which is what left this amp drawing ~3W halted
# while both were on. Nothing is wired to GPIO3 here anyway; what starts the amp
# again is the plug coming back on, which needs at least 60 seconds off for the
# brick's capacitors to drain.
smartamp_power_off_on_halt: true

# Take the USB-A sockets dark while the room is empty, so the deck and the
# ReSpeaker cost nothing there. The VL805 switches all four together on firmware
# 000137ad or newer (this board is on 138c0); with the deck dark and no power
# button, presence returning is what wakes the amp.
smartamp_sleep_usb_power_off: true

# Kept on, with the journal persisted, while the USB-gadget crash is being
# investigated. Turn both back to the shared defaults once that is closed.
smartamp_debug_logging: true
smartamp_journal_in_ram: false
