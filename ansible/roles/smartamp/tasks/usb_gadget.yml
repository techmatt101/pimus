---
# The USB-C controller is normally used for power/host operation. Peripheral
# mode is required for the Pi to appear as a sound card to a connected computer.
# On a Pi 4B that port's VBUS is wired to the same 5V rail as the GPIO header,
# with no PMIC between them, so the host cable must have its power line cut or
# the computer and the AAmp60 end up feeding the rail against each other.
- name: Enable the USB-C peripheral controller
  ansible.builtin.blockinfile:
    path: /boot/firmware/config.txt
    marker: "# {mark} SMART AMP USB AUDIO"
    block: |
      dtoverlay=dwc2,dr_mode=peripheral
  notify: Reboot Smart Amp

# dwc2 is the peripheral controller driver; libcomposite provides ConfigFS USB
# functions, including the UAC2 audio function assembled by our script.
- name: Load USB gadget modules at boot
  ansible.builtin.copy:
    dest: /etc/modules-load.d/smartamp-usb-gadget.conf
    content: |
      dwc2
      libcomposite
    owner: root
    group: root
    mode: "0644"
  notify: Reboot Smart Amp

# ConfigFS gadgets are runtime kernel objects, not permanent files. Recreate the
# stereo 48 kHz sound-card function deterministically after each boot.
- name: Install UAC2 gadget setup script
  ansible.builtin.copy:
    src: scripts/usb-audio-gadget.sh
    dest: "{{ smartamp_app_dir }}/usb-audio-gadget.sh"
    owner: root
    group: root
    mode: "0755"
  notify: Reboot Smart Amp

# In gadget mode the Pi is GPIO-powered, so the bootloader has no USB-PD source
# to negotiate with; without a declared supply it assumes a weak one, logs a
# low-power warning at boot, and caps USB-A output at 600mA total. That
# declaration is PSU_MAX_CURRENT, applied with the rest of the bootloader
# settings in eeprom.yml, and it exists only on the Pi 5: a Pi 4B's USB-A budget
# is fixed in hardware at roughly 1.2A total whatever it is powered from, so
# deck plus ReSpeaker there wants a powered hub. This does not affect a host
# computer's willingness to enumerate the gadget (tested: a Mac still needs a
# dock either way, see docs/troubleshooting.md).

# Run gadget creation only after the kernel modules are available and tear it
# down cleanly on service stop/reconfiguration.
- name: Install UAC2 gadget service
  ansible.builtin.template:
    src: smartamp-usb-audio-gadget.service.j2
    dest: /etc/systemd/system/smartamp-usb-audio-gadget.service
    owner: root
    group: root
    mode: "0644"
  # The gadget's descriptors now live in this unit's Environment=. The setup
  # script only writes them when it creates the gadget cold, so a changed value
  # needs a reboot to re-create it, exactly as the script template did before.
  notify:
    - Reload systemd
    - Reboot Smart Amp
