---
# Order matters: validate first, create the persistent audio user, configure the
# physical audio graph, and only then add clients and controllers.
# Always run validation, even in tag-limited runs such as "make deploy-controller",
# so a targeted update cannot deploy inventory values a full provision would reject.
- name: Run preflight checks
  ansible.builtin.import_tasks: preflight.yml
  tags: [ always ]

- name: Configure the base system
  ansible.builtin.import_tasks: base.yml

- name: Reduce SD-card wear
  ansible.builtin.import_tasks: sdcard.yml

# One place owns the bootloader EEPROM, ahead of the features whose flags it
# reads, so a single staged update carries every setting into the next boot. A
# board with no keys has no EEPROM to read either - rpi-eeprom-config is not
# something a BCM2710 answers - so the whole file is skipped rather than made to
# cope with an empty wanted list.
- name: Configure the bootloader EEPROM
  ansible.builtin.import_tasks: eeprom.yml
  when: smartamp_board_caps.eeprom_keys | length > 0

- name: Configure the on-board radios
  ansible.builtin.import_tasks: radios.yml

- name: Configure audio hardware and PipeWire
  ansible.builtin.import_tasks: audio.yml

- name: Configure USB audio gadget
  ansible.builtin.import_tasks: usb_gadget.yml
  when: usb_audio_gadget_enabled | bool

# Feature flags must be reversible. Removing the overlay returns USB-C to its
# normal role rather than leaving stale boot configuration from an earlier run.
- name: Remove USB-C peripheral overlay when disabled
  ansible.builtin.blockinfile:
    path: /boot/firmware/config.txt
    marker: "# {mark} SMART AMP USB AUDIO"
    state: absent
  when: not (usb_audio_gadget_enabled | bool)
  notify: Reboot Smart Amp

# Stop old units as well as skipping new installation, so toggling a variable is
# sufficient to disable a feature on an already-provisioned Pi.
- name: Disable USB audio gadget service when disabled
  ansible.builtin.systemd_service:
    name: smartamp-usb-audio-gadget.service
    enabled: false
    state: stopped
  failed_when: false
  when: not (usb_audio_gadget_enabled | bool)

# Without this, dwc2/libcomposite would still load at every boot and a stale
# unit and script would remain, contradicting the reversible-flag rule.
- name: Remove USB audio gadget artifacts when disabled
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/modules-load.d/smartamp-usb-gadget.conf
    - /etc/systemd/system/smartamp-usb-audio-gadget.service
    - "{{ smartamp_app_dir }}/usb-audio-gadget.sh"
  notify: Reload systemd
  when: not (usb_audio_gadget_enabled | bool)

- name: Configure Sendspin
  ansible.builtin.import_tasks: sendspin.yml
  when: sendspin_enabled | bool

# Avoid leaving the remote music player advertised after its feature flag is
# turned off.
- name: Disable Sendspin when disabled
  ansible.builtin.systemd_service:
    name: smartamp-sendspin.service
    enabled: false
    state: stopped
  failed_when: false
  when: not (sendspin_enabled | bool)

# A disabled client should leave neither an advertised unit nor an unused
# playback runtime on a deliberately lightweight endpoint. Runtime settings in
# /var/lib survive, matching the voice-assistant removal policy.
- name: Remove Sendspin artifacts when disabled
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/systemd/system/smartamp-sendspin.service
    - "{{ smartamp_app_dir }}/sendspin"
  notify: Reload systemd
  when: not (sendspin_enabled | bool)

- name: Configure Home Assistant voice
  ansible.builtin.import_tasks: voice.yml
  when: voice_assistant_enabled | bool

# Stop exposing the ESPHome voice satellite when voice support is disabled.
- name: Disable Home Assistant voice when disabled
  ansible.builtin.systemd_service:
    name: smartamp-voice-assistant.service
    enabled: false
    state: stopped
  failed_when: false
  when: not (voice_assistant_enabled | bool)

# Preserve downloaded models/preferences in /var/lib, but remove executable
# voice code and its unit so disabling voice also reclaims the large virtualenv.
- name: Remove Home Assistant voice artifacts when disabled
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/systemd/system/smartamp-voice-assistant.service
    - "{{ smartamp_app_dir }}/linux-voice-assistant"
    - "{{ smartamp_app_dir }}/smartamp_lva.py"
    - "{{ smartamp_app_dir }}/wait-audio-ready.sh"
    - "{{ smartamp_app_dir }}/xvf3800-host-control"
    - /usr/local/bin/xvf_host
  notify: Reload systemd
  when: not (voice_assistant_enabled | bool)

# The controller changes far more often than the rest of the system. The tag
# lets "make deploy-controller" push a rebuilt controller to an already
# provisioned Pi without walking the audio, voice, and boot configuration.
- name: Configure the local hardware controller
  ansible.builtin.import_tasks: controller.yml
  tags: [ controller ]

- name: Install diagnostics
  ansible.builtin.import_tasks: diagnostics.yml

# Apply deferred daemon reloads and restarts before Ansible reports success. This
# also surfaces service-start problems during provisioning rather than later.
# "always" keeps this flush active during tag-limited runs; an untagged meta
# task would be skipped under --tags and defer restarts to the end of play.
- name: Flush configuration handlers
  ansible.builtin.meta: flush_handlers
  tags: [ always ]
