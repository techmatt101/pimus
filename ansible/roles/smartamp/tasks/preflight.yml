---
# /proc/device-tree/model is authoritative even when the OS image has been
# renamed. Reading it before editing boot files prevents applying Pi 5-specific
# overlays and USB-controller settings to unrelated hardware.
- name: Read Raspberry Pi model
  ansible.builtin.slurp:
    src: /proc/device-tree/model
  register: raspberry_pi_model_raw

# Device-tree strings are NUL-terminated, so normalise the value before testing
# and before displaying it in a useful failure message.
- name: Set Raspberry Pi model
  ansible.builtin.set_fact:
    raspberry_pi_model: "{{ raspberry_pi_model_raw.content | b64decode | replace('\u0000', '') }}"

# This project relies on Pi 5 USB-C peripheral support, the arm64 LVA build, and
# Debian package names. Fail early instead of leaving a half-configured system.
- name: Check the target platform
  ansible.builtin.assert:
    that:
      - ansible_architecture in ['aarch64', 'arm64']
      - "'Raspberry Pi 5' in raspberry_pi_model"
      - ansible_os_family == 'Debian'
    fail_msg: >-
      This recipe requires 64-bit Raspberry Pi OS on a Pi 5. Detected
      {{ raspberry_pi_model }}, {{ ansible_distribution }} {{ ansible_distribution_version }},
      {{ ansible_architecture }}.

# Bookworm moved config.txt under /boot/firmware. Confirm that expected layout
# before any blockinfile task is allowed to modify boot configuration.
- name: Locate Raspberry Pi boot configuration
  ansible.builtin.stat:
    path: /boot/firmware/config.txt
  register: boot_config

- name: Require the Bookworm or Trixie boot layout
  ansible.builtin.assert:
    that: boot_config.stat.exists
    fail_msg: "Expected /boot/firmware/config.txt; Raspberry Pi OS older than Bookworm is unsupported."

# These values become PipeWire node names and gain levels. Validate them before
# provisioning can restart any live audio service.
- name: Validate voice ducking settings
  ansible.builtin.assert:
    that:
      - smartamp_background_sink_name is match('^[A-Za-z0-9._]+$')
      - (smartamp_voice_duck_volume_percent | int) >= 0
      - (smartamp_voice_duck_volume_percent | int) <= 100
      - (smartamp_voice_duck_fade_ms | int) >= 0
    fail_msg: >-
      Voice ducking requires a PipeWire-safe background sink name, a volume
      from 0 to 100 percent, and a non-negative fade time.
  when: smartamp_voice_ducking_enabled | bool

# Invalid regular expressions otherwise leave the audio manager restarting in
# a loop. Compile every hardware matcher before any configuration is changed.
- name: Validate PipeWire device matching expressions
  ansible.builtin.command:
    argv:
      - python3
      - -c
      - "import re, sys; [re.compile(value) for value in sys.argv[1:]]"
      - "{{ smartamp_output_match }}"
      - "{{ smartamp_aux_match }}"
      - "{{ smartamp_voice_input_match }}"
      - "{{ smartamp_aec_reference_match }}"
      - "{{ smartamp_usb_gadget_match }}"
  changed_when: false

# These ranges come from ALSA controls, USB Audio descriptors, the ESPHome
# socket, and the physical LED/deck APIs. Failing here is safer than silently
# clipping or ignoring inventory values in a running service.
- name: Validate hardware and controller ranges
  ansible.builtin.assert:
    that:
      - (hifiberry_output_volume_percent | int) >= 0
      - (hifiberry_output_volume_percent | int) <= 100
      - (smartamp_aux_latency_ms | int) >= 0
      - (usb_audio_sample_rate | int) >= 8000
      - (usb_audio_sample_rate | int) <= 192000
      - (usb_audio_sample_size_bytes | int) in [2, 3, 4]
      - (voice_assistant_mic_channels | int) >= 1
      - (voice_assistant_mic_channels | int) <= 8
      - (voice_assistant_mic_volume | int) >= 0
      - (voice_assistant_mic_volume | int) <= 100
      - (voice_assistant_port | int) >= 1
      - (voice_assistant_port | int) <= 65535
      - (voice_assistant_peripheral_port | int) >= 1
      - (voice_assistant_peripheral_port | int) <= 65535
      - (voice_assistant_port | int) != (voice_assistant_peripheral_port | int)
      - (respeaker_led_brightness | int) >= 0
      - (respeaker_led_brightness | int) <= 255
      - (streamdeck_brightness | int) >= 0
      - (streamdeck_brightness | int) <= 100
      - (streamdeck_keys | length) <= 8
      - (streamdeck_dials | length) <= 4
      - home_assistant_webhook_base == '' or home_assistant_webhook_base is match('^https?://')
    fail_msg: >-
      Hardware/controller inventory contains an out-of-range value, conflicting
      voice ports, too many Stream Deck controls, or an invalid webhook URL.

# YAML 1.1 treats unquoted on/off as booleans. Flatten every configured gesture
# and require string commands here before it can become broken controller JSON.
- name: Collect configured Stream Deck actions
  ansible.builtin.set_fact:
    smartamp_streamdeck_actions: >-
      {{
        (streamdeck_keys | map(attribute='action', default={'type': 'noop'}) | list)
        + (streamdeck_dials | map(attribute='left', default={'type': 'noop'}) | list)
        + (streamdeck_dials | map(attribute='right', default={'type': 'noop'}) | list)
        + (streamdeck_dials | map(attribute='press', default={'type': 'noop'}) | list)
      }}
  when: streamdeck_enabled | bool

- name: Validate configured Stream Deck actions
  ansible.builtin.assert:
    that:
      - item.type in ['noop', 'lva', 'audio', 'webhook']
      - item.type in ['noop', 'webhook'] or (item.command is defined and item.command is string)
      - item.type != 'webhook' or (item.id is defined and item.id is string and item.id | length > 0)
      - item.type != 'webhook' or home_assistant_webhook_base is match('^https?://')
      - >-
        item.type != 'audio' or
        ((item.source is defined and item.source in ['aux', 'usb'] and item.command in ['on', 'off', 'toggle']) or
         (item.source is not defined and item.command in ['up', 'down', 'mute']))
      - >-
        item.type != 'lva' or item.command in
        ['start_listening', 'stop_pipeline', 'mute_mic', 'unmute_mic', 'mute_toggle',
         'volume_up', 'volume_down', 'stop_timer_ringing', 'pause_media_player',
         'resume_media_player', 'stop_media_player', 'media_toggle',
         'button_single_press', 'button_double_press', 'button_triple_press',
         'button_long_press', 'stop']
    fail_msg: >-
      Stream Deck action {{ item }} has an invalid type, source, command, or
      webhook identifier. Quote YAML commands such as "on" and "off".
  loop: "{{ smartamp_streamdeck_actions }}"
  loop_control:
    label: "{{ item.type | default('missing type') }}:{{ item.command | default(item.id | default('')) }}"
  when: streamdeck_enabled | bool

# Labels and colours affect only rendering, so validate them once at provision
# time rather than carrying the same schema checks in the long-running process.
- name: Validate configured Stream Deck keys
  ansible.builtin.assert:
    that:
      - item.label is defined and item.label is string
      - item.color is defined and item.color is match('^#[0-9A-Fa-f]{6}$')
    fail_msg: "Each Stream Deck key requires a text label and #RRGGBB colour."
  loop: "{{ streamdeck_keys }}"
  loop_control:
    label: "{{ item.label | default('missing label') }}"
  when: streamdeck_enabled | bool

- name: Validate configured Stream Deck dial labels
  ansible.builtin.assert:
    that:
      - item.label is defined and item.label is string
    fail_msg: "Each Stream Deck dial requires a text label."
  loop: "{{ streamdeck_dials }}"
  loop_control:
    label: "{{ item.label | default('missing label') }}"
  when: streamdeck_enabled | bool

# The XVF3800 protocol accepts only the documented effects and byte brightness.
# Check every state colour here so a typo cannot turn into an unintended LED.
- name: Validate ReSpeaker LED states
  ansible.builtin.assert:
    that:
      - item.value.effect in ['off', 'breath', 'rainbow', 'single', 'doa', 'ring']
      - item.value.color is match('^#[0-9A-Fa-f]{6}$')
      - item.value.accent is not defined or item.value.accent is match('^#[0-9A-Fa-f]{6}$')
      - item.value.brightness is not defined or ((item.value.brightness | int) >= 0 and (item.value.brightness | int) <= 255)
    fail_msg: "ReSpeaker state {{ item.key }} has an invalid effect, colour, or brightness."
  loop: "{{ respeaker_led_states | dict2items }}"
  loop_control:
    label: "{{ item.key }}"
  when: respeaker_led_enabled | bool
