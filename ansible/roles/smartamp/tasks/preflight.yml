---
# /proc/device-tree/model is authoritative even when the OS image has been
# renamed. Reading it before editing boot files prevents applying Pi 5-specific
# overlays and USB-controller settings to unrelated hardware.
- name: Read Raspberry Pi model
  ansible.builtin.slurp:
    src: /proc/device-tree/model
  register: raspberry_pi_model_raw

# Device-tree strings are NUL-terminated, so normalise the value before testing
# and before displaying it in a useful failure message.
- name: Set Raspberry Pi model
  ansible.builtin.set_fact:
    raspberry_pi_model: "{{ raspberry_pi_model_raw.content | b64decode | replace('\u0000', '') }}"

# This project relies on Pi 5 USB-C peripheral support, the arm64 LVA build, and
# Debian package names. Fail early instead of leaving a half-configured system.
- name: Check the target platform
  ansible.builtin.assert:
    that:
      - ansible_architecture in ['aarch64', 'arm64']
      - "'Raspberry Pi 5' in raspberry_pi_model"
      - ansible_os_family == 'Debian'
    fail_msg: >-
      This recipe requires 64-bit Raspberry Pi OS on a Pi 5. Detected
      {{ raspberry_pi_model }}, {{ ansible_distribution }} {{ ansible_distribution_version }},
      {{ ansible_architecture }}.

# Bookworm moved config.txt under /boot/firmware. Confirm that expected layout
# before any blockinfile task is allowed to modify boot configuration.
- name: Locate Raspberry Pi boot configuration
  ansible.builtin.stat:
    path: /boot/firmware/config.txt
  register: boot_config

- name: Require the Bookworm or Trixie boot layout
  ansible.builtin.assert:
    that: boot_config.stat.exists
    fail_msg: "Expected /boot/firmware/config.txt; Raspberry Pi OS older than Bookworm is unsupported."

# These values become PipeWire node names and gain levels. Validate them before
# provisioning can restart any live audio service.
- name: Validate voice ducking settings
  ansible.builtin.assert:
    that:
      - smartamp_background_sink_name is match('^[A-Za-z0-9._]+$')
      - (smartamp_voice_duck_volume_percent | int) >= 0
      - (smartamp_voice_duck_volume_percent | int) <= 100
      - (smartamp_voice_duck_fade_ms | int) >= 0
    fail_msg: >-
      Voice ducking requires a PipeWire-safe background sink name, a volume
      from 0 to 100 percent, and a non-negative fade time.
  when: smartamp_voice_ducking_enabled | bool

# Invalid regular expressions otherwise leave the audio manager restarting in
# a loop. Compile every hardware matcher before any configuration is changed.
- name: Validate PipeWire device matching expressions
  ansible.builtin.command:
    argv:
      - python3
      - -c
      - "import re, sys; [re.compile(value) for value in sys.argv[1:]]"
      - "{{ smartamp_output_match }}"
      - "{{ smartamp_aux_match }}"
      - "{{ smartamp_voice_input_match }}"
      - "{{ smartamp_aec_reference_match }}"
      - "{{ smartamp_usb_gadget_match }}"
  changed_when: false

# These ranges come from ALSA controls, USB Audio descriptors, the ESPHome
# socket, and the physical LED/deck APIs. Failing here is safer than silently
# clipping or ignoring inventory values in a running service.
- name: Validate hardware and controller ranges
  ansible.builtin.assert:
    that:
      - (hifiberry_output_volume_percent | int) >= 0
      - (hifiberry_output_volume_percent | int) <= 100
      - (smartamp_loopback_latency_ms | int) >= 0
      - (smartamp_aux_latency_ms | int) >= 0
      - (usb_audio_sample_rate | int) >= 8000
      - (usb_audio_sample_rate | int) <= 192000
      - (usb_audio_sample_size_bytes | int) in [2, 3, 4]
      - (usb_audio_psu_max_current_ma | int) >= 3000
      - (usb_audio_psu_max_current_ma | int) <= 5000
      - smartamp_voice_capture_channel is none or
        ((smartamp_voice_capture_channel | int) >= 0 and
        (smartamp_voice_capture_channel | int) <= 7)
      - (voice_assistant_mic_volume | int) >= 0
      - (voice_assistant_mic_volume | int) <= 100
      - (voice_assistant_port | int) >= 1
      - (voice_assistant_port | int) <= 65535
      - (voice_assistant_peripheral_port | int) >= 1
      - (voice_assistant_peripheral_port | int) <= 65535
      - (voice_assistant_port | int) != (voice_assistant_peripheral_port | int)
      - (respeaker_led_brightness | int) >= 0
      - (respeaker_led_brightness | int) <= 255
      - home_assistant_url == '' or home_assistant_url is match('^https?://')
      - sendspin_server_url == '' or sendspin_server_url is match('^wss?://')
    fail_msg: >-
      Hardware/controller inventory contains an out-of-range value, conflicting
      voice ports, or an invalid Home Assistant or Sendspin server URL.

# Tokens are typed on the Pi itself, in a file this repository never writes and
# never reads the values of, so provisioning has to confirm they are actually
# there. Which ones are needed follows from the features that are switched on:
# a Home Assistant URL implies a token to authenticate with, and the remote-tile
# listener must not open without its shared secret.
- name: Select the controller secrets this deployment requires
  ansible.builtin.set_fact:
    smartamp_required_secrets: >-
      {{ (['HOME_ASSISTANT_TOKEN'] if home_assistant_url | length > 0 else [])
         + (['REMOTE_TILES_TOKEN'] if remote_tiles_enabled | bool else []) }}

- name: Check the controller secrets file exists
  ansible.builtin.stat:
    path: "{{ smartamp_secrets_file }}"
  register: smartamp_secrets_stat
  when: smartamp_required_secrets | length > 0

# Failing here, before anything has been reconfigured, beats a controller that
# installs cleanly and then crash-loops on a token nobody remembered to write.
- name: Require the controller secrets file
  ansible.builtin.assert:
    that:
      - smartamp_secrets_stat.stat.exists
    fail_msg: >-
      {{ smartamp_secrets_file }} does not exist on {{ inventory_hostname }}.
      Create it on the Pi and re-run: "sudo mkdir -p {{ smartamp_config_dir }}"
      then "sudo nano {{ smartamp_secrets_file }}", with one KEY=value line for
      each of {{ smartamp_required_secrets | join(', ') }}.
  when: smartamp_required_secrets | length > 0

# grep runs on the Pi and reports only whether a line matched, so the token
# values stay on the device instead of travelling back over SSH into task
# output. An empty or commented-out assignment counts as missing.
- name: Check the controller secrets file defines every required token
  ansible.builtin.command:
    argv:
      - grep
      - -Eq
      - '^[[:space:]]*{{ item }}=[[:space:]]*"?[^"[:space:]]'
      - "{{ smartamp_secrets_file }}"
  register: smartamp_secrets_present
  changed_when: false
  failed_when: false
  loop: "{{ smartamp_required_secrets }}"

- name: Require every controller token to have a value
  ansible.builtin.assert:
    that:
      - smartamp_secrets_present.results | rejectattr('rc', 'equalto', 0) | list | length == 0
    fail_msg: >-
      {{ smartamp_secrets_file }} has no value for
      {{ smartamp_secrets_present.results | rejectattr('rc', 'equalto', 0)
         | map(attribute='item') | join(', ') }}.
      Add one KEY=value line per token and re-run.
  when: smartamp_required_secrets | length > 0

# The Stream Deck key/dial layout is compiled into the controller
# (streamdeck/layout.mts) and validated by its own Node test, so there is no
# YAML layout to schema-check here.

# The ReSpeaker state-to-appearance map is compiled into the controller
# (voice/led-states.mts) and validated by its own Node test, exactly as the
# deck layout is; only the ring brightness deploys from inventory.
- name: Validate ReSpeaker LED brightness
  ansible.builtin.assert:
    that:
      - (respeaker_led_brightness | int) >= 0
      - (respeaker_led_brightness | int) <= 255
    fail_msg: "respeaker_led_brightness must be a byte (0-255)."
  when: respeaker_led_enabled | bool
