---
# The overlay and its parameters, assembled as one dtoverlay= line: the board
# chosen in inventory brings the overlay name, and auto_mute is appended only
# for a board whose amplifier the Pi can actually mute.
- name: Work out the HiFiBerry overlay line
  ansible.builtin.set_fact:
    smartamp_hifiberry_overlay: >-
      {{ ([smartamp_hifiberry_caps.overlay]
          + (['auto_mute'] if hifiberry_auto_mute | bool else []))
         | join(',') }}

# Disable the Pi's onboard audio to avoid ambiguous card numbering, then load
# the board's driver. force_eeprom_read=0 is the HiFiBerry workaround that
# lets the explicitly selected overlay configure the HAT rather than whatever
# the board's own EEPROM claims; it is what the Pi 5 needs and is harmless on
# a Pi 4B. It is also why the board is named in inventory rather than detected.
- name: Configure the HiFiBerry overlay
  ansible.builtin.blockinfile:
    path: /boot/firmware/config.txt
    marker: "# {mark} SMART AMP AUDIO"
    block: |
      dtparam=audio=off
      force_eeprom_read=0
      dtoverlay={{ smartamp_hifiberry_overlay }}
  notify: Reboot Smart Amp

# Device names can change with USB enumeration. The generated config stores
# property-match expressions and initial route state instead of ALSA card IDs.
- name: Install audio configuration
  ansible.builtin.template:
    src: audio.json.j2
    dest: "{{ smartamp_config_dir }}/audio.json"
    owner: root
    group: "{{ smartamp_service_user }}"
    mode: "0640"
  notify: Restart audio manager

- name: Install shared audio primitives
  ansible.builtin.include_tasks: python_package.yml
  vars:
    python_package_source: "{{ smartamp_libs_dir }}/audio-common/src/smartamp_audio"
    python_package_dir: "{{ smartamp_app_dir }}/audio-common/smartamp_audio"
    python_package_handlers: [Restart audio manager, Restart USB audio]

- name: Install audio manager
  ansible.builtin.include_tasks: python_package.yml
  vars:
    python_package_source: "{{ smartamp_audio_manager_source }}"
    python_package_dir: "{{ smartamp_audio_manager_dir }}"
    python_package_handlers: [Restart audio manager]
    python_package_entrypoint: __main__.py

# The daemon used to be a single script deployed beside the shell helpers.
- name: Remove the superseded single-file audio manager
  ansible.builtin.file:
    path: "{{ smartamp_app_dir }}/audio_manager.py"
    state: absent
  notify: Restart audio manager

# ALSA mixer defaults are not guaranteed after a clean image. Apply the chosen
# ADC pins/gain and a conservative amplifier level on every boot.
- name: Install HiFiBerry mixer initialisation
  ansible.builtin.copy:
    src: scripts/hifiberry-init.sh
    dest: "{{ smartamp_app_dir }}/hifiberry-init.sh"
    owner: root
    group: root
    mode: "0755"
  notify: Restart HiFiBerry

# WirePlumber would otherwise map sink volume onto the DAC's `Digital` control,
# and the audio manager pinning the output sink at 100% would push the
# hifiberry_output_volume_percent ceiling straight back to 0 dB. The soft-mixer
# rule keeps PipeWire's volume in software so the hardware ceiling the init
# script sets actually holds — it is the pop protection between a full-scale
# transient and the amplifier. Two files because the two supported OS releases
# read different formats: Trixie's WirePlumber 0.5 reads wireplumber.conf.d,
# Bookworm's 0.4 reads main.lua.d, and each ignores the other's directory.
- name: Create WirePlumber configuration directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop:
    - /etc/wireplumber/wireplumber.conf.d
    - /etc/wireplumber/main.lua.d

- name: Keep PipeWire volume off the HiFiBerry hardware mixer
  ansible.builtin.copy:
    src: "wireplumber/{{ item.file }}"
    dest: "/etc/wireplumber/{{ item.dir }}/{{ item.file }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - { dir: wireplumber.conf.d, file: 51-smartamp-soft-mixer.conf }
    - { dir: main.lua.d, file: 51-smartamp-soft-mixer.lua }
  notify: Restart service-account session

# A separate early service ensures ALSA has detected the HAT before mixer
# settings are applied and before PipeWire begins routing sound.
- name: Install HiFiBerry initialisation service
  ansible.builtin.template:
    src: smartamp-hifiberry.service.j2
    dest: /etc/systemd/system/smartamp-hifiberry.service
    owner: root
    group: root
    mode: "0644"
  notify:
    - Reload systemd
    - Restart HiFiBerry

# systemd restarts the router if a USB device is re-enumerated or the process
# fails, keeping the headless amp self-healing.
- name: Install audio manager service
  ansible.builtin.template:
    src: smartamp-audio-manager.service.j2
    dest: /etc/systemd/system/smartamp-audio-manager.service
    owner: root
    group: root
    mode: "0644"
  notify:
    - Reload systemd
    - Restart audio manager
