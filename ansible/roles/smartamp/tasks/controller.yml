---
# Voice ducking consumes the same LVA event stream as the physical feedback
# devices, so it also needs the controller when both USB surfaces are disabled.
- name: Determine whether the local controller is needed
  ansible.builtin.set_fact:
    smartamp_controller_enabled: >-
      {{
        (streamdeck_enabled | bool)
        or (respeaker_led_enabled | bool)
        or ((voice_assistant_enabled | bool) and (smartamp_voice_ducking_enabled | bool))
      }}

# The Node usb library sends XVF3800 vendor-control transfers directly. Grant
# only the service account's plugdev group instead of running the app as root.
- name: Install ReSpeaker USB permissions
  ansible.builtin.copy:
    dest: /etc/udev/rules.d/60-smartamp-respeaker.rules
    content: |
      SUBSYSTEM=="usb", ATTR{idVendor}=="2886", ATTR{idProduct}=="001a", MODE:="0660", GROUP="plugdev"
    owner: root
    group: root
    mode: "0644"
  notify: Reload udev
  when: respeaker_led_enabled | bool

# Remove a stale permission rule when LED support is disabled later.
- name: Remove ReSpeaker USB permissions when disabled
  ansible.builtin.file:
    path: /etc/udev/rules.d/60-smartamp-respeaker.rules
    state: absent
  notify: Reload udev
  when: not (respeaker_led_enabled | bool)

# Stream Deck+ is exposed as hidraw. Group-scoped access lets the controller
# open it without broad root privileges or the Elgato desktop application.
- name: Install Stream Deck USB permissions
  ansible.builtin.copy:
    dest: /etc/udev/rules.d/60-smartamp-streamdeck.rules
    content: |
      KERNEL=="hidraw*", ATTRS{idVendor}=="0fd9", ATTRS{idProduct}=="0084", MODE:="0660", GROUP="plugdev"
    owner: root
    group: root
    mode: "0644"
  notify: Reload udev
  when: streamdeck_enabled | bool

# Remove a stale hidraw permission rule when Stream Deck support is disabled.
- name: Remove Stream Deck USB permissions when disabled
  ansible.builtin.file:
    path: /etc/udev/rules.d/60-smartamp-streamdeck.rules
    state: absent
  notify: Reload udev
  when: not (streamdeck_enabled | bool)

# Keep the app, its src directory, and node_modules together under /opt rather
# than installing project-specific npm packages globally.
- name: Create hardware controller directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop:
    - "{{ smartamp_app_dir }}/controller"
    - "{{ smartamp_app_dir }}/controller/src"
    - "{{ smartamp_app_dir }}/controller/assets"
    - "{{ smartamp_app_dir }}/controller/assets/fonts"
  when: smartamp_controller_enabled | bool

# package.json pins every direct dependency to an exact version. The control
# computer develops in a pnpm workspace whose lockfile stays there; the Pi
# installs with plain npm so it needs no extra tooling, and npm writes its own
# lockfile here on the first install, keeping later runs reproducible.
- name: Install hardware controller manifest
  ansible.builtin.copy:
    src: "{{ smartamp_source_dir }}/controller/package.json"
    dest: "{{ smartamp_app_dir }}/controller/package.json"
    owner: root
    group: root
    mode: "0644"
  register: controller_manifests
  when: smartamp_controller_enabled | bool

# A hidden npm lock can survive an interrupted or manually damaged install.
# Ask npm to verify every direct production dependency instead of trusting one
# marker file.
- name: Check installed hardware controller dependencies
  ansible.builtin.command: npm ls --omit=dev --omit=peer --depth=0
  args:
    chdir: "{{ smartamp_app_dir }}/controller"
  register: controller_dependencies
  changed_when: false
  failed_when: false
  when: smartamp_controller_enabled | bool

# Omit development tooling. The native JPEG encoder (@julusian/jpeg-turbo) is a
# direct pinned dependency with an arm64 prebuild — without it Elgato falls back
# to pure-JS jpeg-js, which saturates the CPU repainting the deck.
- name: Install hardware controller dependencies
  ansible.builtin.command: npm install --omit=dev --omit=peer --no-audit --no-fund
  args:
    chdir: "{{ smartamp_app_dir }}/controller"
  when:
    - smartamp_controller_enabled | bool
    - >-
      (controller_manifests.changed | default(false)) or
      (controller_dependencies.rc | default(1)) != 0
  notify: Restart controller

# The controller is written in TypeScript and compiled on this computer, so the
# Pi needs no build tooling and keeps running plain ESM under the NodeSource
# nodejs package. "make provision" builds first; check the output before copying so a
# missing build fails here instead of leaving a stale controller on the Pi.
# The compiled tree is nested (actions/, audio/, streamdeck/, voice/), so search
# recursively and track each module by its path relative to dist/src. That
# relative path is what the Pi mirrors, keeping import specifiers valid.
- name: Find compiled hardware controller modules
  ansible.builtin.find:
    paths: "{{ smartamp_source_dir }}/controller/dist/src"
    patterns: "*.mjs"
    file_type: file
    recurse: true
  delegate_to: localhost
  become: false
  register: compiled_controller_modules
  when: smartamp_controller_enabled | bool

- name: Record compiled hardware controller modules
  ansible.builtin.set_fact:
    smartamp_controller_modules: >-
      {{ compiled_controller_modules.files | default([]) | map(attribute='path')
         | map('relpath', smartamp_source_dir + '/controller/dist/src') | list }}
  when: smartamp_controller_enabled | bool

- name: Require a compiled hardware controller
  ansible.builtin.assert:
    that:
      - smartamp_controller_modules | length > 0
      - "'index.mjs' in smartamp_controller_modules"
    fail_msg: >-
      The compiled controller entrypoint is missing from
      apps/controller/dist/src. Run "make build" on this computer before
      provisioning.
  when: smartamp_controller_enabled | bool

# TypeScript no longer emits a module after its source is deleted. Remove any
# corresponding old file on the Pi so Node cannot load code from a prior build.
- name: Find deployed hardware controller modules
  ansible.builtin.find:
    paths: "{{ smartamp_app_dir }}/controller/src"
    patterns: "*.mjs"
    file_type: file
    recurse: true
  register: deployed_controller_modules
  when: smartamp_controller_enabled | bool

- name: Remove obsolete hardware controller modules
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: absent
  loop: "{{ deployed_controller_modules.files | default([]) }}"
  loop_control:
    label: "{{ item.path | relpath(smartamp_app_dir + '/controller/src') }}"
  when:
    - smartamp_controller_enabled | bool
    - item.path | relpath(smartamp_app_dir + '/controller/src') not in smartamp_controller_modules
  notify: Restart controller

# Deploy the modules into src so the installed layout mirrors the app boundary
# in Git and makes runtime ownership clear during troubleshooting. copy does not
# create intermediate directories, so make the subfolders first.
- name: Create hardware controller module directories
  ansible.builtin.file:
    path: "{{ smartamp_app_dir }}/controller/src/{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop: >-
    {{ smartamp_controller_modules | map('dirname') | reject('equalto', '') | unique | sort | list }}
  when: smartamp_controller_enabled | bool

- name: Install hardware controller modules
  ansible.builtin.copy:
    src: "{{ smartamp_source_dir }}/controller/dist/src/{{ item }}"
    dest: "{{ smartamp_app_dir }}/controller/src/{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop: "{{ smartamp_controller_modules }}"
  notify: Restart controller
  when: smartamp_controller_enabled | bool

# Raspberry Pi OS Lite ships almost no fonts, and the controller must not fall
# back to whatever a given image happens to have: the deck would draw its labels
# blank. The bundled face is deployed beside the modules, where
# streamdeck/surface.mjs resolves it relative to itself.
- name: Find compiled hardware controller assets
  ansible.builtin.find:
    paths: "{{ smartamp_source_dir }}/controller/dist/assets"
    file_type: file
    recurse: true
  delegate_to: localhost
  become: false
  register: compiled_controller_assets
  when: smartamp_controller_enabled | bool

- name: Require the bundled hardware controller font
  ansible.builtin.assert:
    that:
      - compiled_controller_assets.files | default([]) | length > 0
    fail_msg: >-
      The controller's bundled font is missing from apps/controller/dist/assets.
      Run "make build" on this computer before provisioning.
  when: smartamp_controller_enabled | bool

- name: Install hardware controller assets
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: >-
      {{ smartamp_app_dir }}/controller/assets/{{
        item | relpath(smartamp_source_dir + '/controller/dist/assets') }}
    owner: root
    group: root
    mode: "0644"
  loop: "{{ compiled_controller_assets.files | default([]) | map(attribute='path') | sort | list }}"
  loop_control:
    label: "{{ item | basename }}"
  notify: Restart controller
  when: smartamp_controller_enabled | bool

# The tokens themselves are the user's file: provisioning only tightens its
# permissions, never reads or rewrites the contents. systemd loads it as root
# before dropping to the service account, so the account needs no access at all.
# Editing a token afterwards takes a "systemctl restart smartamp-controller",
# because nothing here can see that the contents changed.
- name: Secure the controller secrets file
  ansible.builtin.file:
    path: "{{ smartamp_secrets_file }}"
    owner: root
    group: root
    mode: "0600"
  when:
    - smartamp_controller_enabled | bool
    - smartamp_required_secrets | length > 0

# Generate physical controls and LED state colours from inventory variables so
# both devices can be customised without changing application source.
- name: Install hardware controller configuration
  ansible.builtin.template:
    src: controller.json.j2
    dest: "{{ smartamp_config_dir }}/controller.json"
    owner: root
    group: "{{ smartamp_service_user }}"
    mode: "0640"
  notify: Restart controller
  when: smartamp_controller_enabled | bool

# One systemd unit now owns the LVA WebSocket and both USB control surfaces,
# giving shared state and reconnect behavior a single lifecycle.
- name: Install hardware controller service
  ansible.builtin.template:
    src: smartamp-controller.service.j2
    dest: /etc/systemd/system/smartamp-controller.service
    owner: root
    group: root
    mode: "0644"
  notify:
    - Reload systemd
    - Restart controller
  when: smartamp_controller_enabled | bool

# Stop an existing controller when hardware surfaces and voice ducking are disabled.
- name: Disable hardware controller service when unused
  ansible.builtin.systemd_service:
    name: smartamp-controller.service
    enabled: false
    state: stopped
  failed_when: false
  when: not (smartamp_controller_enabled | bool)

# Remove compiled modules, production dependencies, generated config, and the
# unit when no enabled feature needs this daemon. Persistent user choices in
# /var/lib remain available if the feature is enabled again later.
- name: Remove hardware controller artifacts when unused
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/systemd/system/smartamp-controller.service
    - "{{ smartamp_config_dir }}/controller.json"
    - "{{ smartamp_app_dir }}/controller"
  notify: Reload systemd
  when: not (smartamp_controller_enabled | bool)
