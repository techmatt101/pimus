---
# These are only installed when voice is enabled. LVA is run directly in a
# Python virtual environment, so no Docker daemon or container packages exist.
- name: Install native Linux Voice Assistant dependencies
  ansible.builtin.apt:
    name:
      # mDNS utilities support ESPHome discovery by the remote HA instance.
      - avahi-utils
      # Provides `ip`, used to determine the address/interface advertised to HA.
      - iproute2
      # Native media playback library used for TTS, announcements, and timers.
      - libmpv-dev
      # Standard process tools expected by the upstream bare-metal install.
      - procps
      # Python headers needed when wake-word/audio extensions compile locally.
      - python3-dev
      # Creates the isolated .venv that replaces a container runtime.
      - python3-venv
    state: present

# Building wake-word dependencies is comparatively expensive. A commit marker
# skips healthy re-runs while rebuilding when the reviewed source changes.
- name: Check native Linux Voice Assistant installation
  ansible.builtin.stat:
    path: "{{ smartamp_app_dir }}/linux-voice-assistant/.smartamp-setup-{{ voice_assistant_commit }}"
  register: voice_assistant_setup_marker

# Use the immutable commit behind the documented release. A shallow checkout
# avoids keeping unrelated upstream history on the SD card.
- name: Check out pinned Linux Voice Assistant release
  ansible.builtin.git:
    repo: https://github.com/OHF-Voice/linux-voice-assistant.git
    dest: "{{ smartamp_app_dir }}/linux-voice-assistant"
    version: "{{ voice_assistant_commit }}"
    # Fetch only the release ref that reaches the pinned commit; supplying it
    # explicitly lets Ansible keep a SHA checkout shallow.
    refspec: "+refs/tags/v{{ voice_assistant_version }}:refs/tags/v{{ voice_assistant_version }}"
    depth: 1
    single_branch: true
    update: true
  register: voice_assistant_checkout

# Fail closed if the remote ref or checkout behavior ever resolves to different
# code than the commit reviewed with this project.
- name: Read checked out Linux Voice Assistant commit
  ansible.builtin.command: git rev-parse HEAD
  args:
    chdir: "{{ smartamp_app_dir }}/linux-voice-assistant"
  register: voice_assistant_checked_out_commit
  changed_when: false

- name: Verify Linux Voice Assistant commit
  ansible.builtin.assert:
    that: voice_assistant_checked_out_commit.stdout == voice_assistant_commit
    fail_msg: >-
      Linux Voice Assistant resolved to
      {{ voice_assistant_checked_out_commit.stdout }}, expected
      {{ voice_assistant_commit }}.

# Older revisions installed a pip constraints file. Upstream's own dependency
# ranges now drive setup, so remove the retired file to avoid implying otherwise.
- name: Remove retired Linux Voice Assistant constraints
  ansible.builtin.file:
    path: "{{ smartamp_app_dir }}/linux-voice-assistant/.smartamp-constraints.txt"
    state: absent

# A release marker alone does not prove that the virtual environment survived
# an interrupted setup or later SD-card damage. Import the core runtime modules
# using the exact interpreter the service will execute.
- name: Check native Linux Voice Assistant runtime
  ansible.builtin.command:
    argv:
      - "{{ smartamp_app_dir }}/linux-voice-assistant/.venv/bin/python"
      - -c
      - "import aioesphomeapi, linux_voice_assistant, mpv, soundcard, websockets"
  args:
    chdir: "{{ smartamp_app_dir }}/linux-voice-assistant"
  register: voice_assistant_runtime
  changed_when: false
  failed_when: false

- name: Determine whether Linux Voice Assistant needs repair
  ansible.builtin.set_fact:
    voice_assistant_needs_setup: >-
      {{
        voice_assistant_checkout.changed
        or not voice_assistant_setup_marker.stat.exists
        or voice_assistant_runtime.rc != 0
      }}

# Upstream's setup script owns creation of .venv and its Python dependencies.
# This is the native/bare-metal client install, not a Home Assistant server.
- name: Install Linux Voice Assistant into its virtual environment
  ansible.builtin.command:
    cmd: script/setup
    chdir: "{{ smartamp_app_dir }}/linux-voice-assistant"
  when: voice_assistant_needs_setup | bool
  notify: Restart voice assistant

# Only write the marker after setup succeeds, so a failed/partial install is
# retried on the next provisioning run.
- name: Record installed Linux Voice Assistant release
  ansible.builtin.file:
    path: "{{ smartamp_app_dir }}/linux-voice-assistant/.smartamp-setup-{{ voice_assistant_commit }}"
    state: touch
    owner: root
    group: root
    mode: "0644"
    modification_time: preserve
    access_time: preserve
  when: voice_assistant_needs_setup | bool

# This wrapper leaves the pinned checkout clean while adding the pause/idle
# peripheral events needed for a reliable physical play/pause control.
- name: Install Smart Amp voice media event adapter
  ansible.builtin.copy:
    src: smartamp_lva.py
    dest: "{{ smartamp_app_dir }}/smartamp_lva.py"
    owner: root
    group: root
    mode: "0755"
  notify: Restart voice assistant

# LVA must start after the audio manager has found both required devices. This
# small gate checks the manager's fresh status file and produces a clear systemd
# failure instead of an obscure SoundCard device-lookup exception.
- name: Install voice audio readiness check
  ansible.builtin.template:
    src: wait-audio-ready.sh.j2
    dest: "{{ smartamp_app_dir }}/wait-audio-ready.sh"
    owner: root
    group: root
    mode: "0755"
  notify: Restart voice assistant

# The unit runs under the same account as PipeWire so it can use the private
# audio socket. It exposes an ESPHome voice satellite to HA on the other host.
- name: Install Home Assistant voice service
  ansible.builtin.template:
    src: smartamp-voice-assistant.service.j2
    dest: /etc/systemd/system/smartamp-voice-assistant.service
    owner: root
    group: root
    mode: "0644"
  notify:
    - Reload systemd
    - Restart voice assistant
