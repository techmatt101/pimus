---
# These are only installed when voice is enabled. LVA is run directly in a
# Python virtual environment, so no Docker daemon or container packages exist.
- name: Install native Linux Voice Assistant dependencies
  ansible.builtin.apt:
    name:
      # mDNS utilities support ESPHome discovery by the remote HA instance.
      - avahi-utils
      # Provides `ip`, used to determine the address/interface advertised to HA.
      - iproute2
      # Native media playback library used for TTS, announcements, and timers.
      - libmpv-dev
      # Standard process tools expected by the upstream bare-metal install.
      - procps
      # Python headers needed when wake-word/audio extensions compile locally.
      - python3-dev
      # Creates the isolated .venv that replaces a container runtime.
      - python3-venv
    state: present

# Building wake-word dependencies is comparatively expensive. A release marker
# skips healthy re-runs while rebuilding when the pinned release changes.
- name: Check native Linux Voice Assistant installation
  ansible.builtin.stat:
    path: "{{ smartamp_app_dir }}/linux-voice-assistant/.smartamp-setup-{{ voice_assistant_version }}"
  register: voice_assistant_setup_marker

# Check out the pinned release tag. A shallow, single-branch clone avoids
# keeping unrelated upstream history on the SD card.
- name: Check out pinned Linux Voice Assistant release
  ansible.builtin.git:
    repo: https://github.com/OHF-Voice/linux-voice-assistant.git
    dest: "{{ smartamp_app_dir }}/linux-voice-assistant"
    version: "v{{ voice_assistant_version }}"
    depth: 1
    single_branch: true
    update: true
  register: voice_assistant_checkout

# Markers from superseded releases would otherwise accumulate and imply
# installs that are no longer present.
- name: Find superseded Linux Voice Assistant setup markers
  ansible.builtin.find:
    paths: "{{ smartamp_app_dir }}/linux-voice-assistant"
    patterns: ".smartamp-setup-*"
    excludes: ".smartamp-setup-{{ voice_assistant_version }}"
    hidden: true
  register: voice_assistant_stale_markers

- name: Remove superseded Linux Voice Assistant setup markers
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: absent
  loop: "{{ voice_assistant_stale_markers.files }}"
  loop_control:
    label: "{{ item.path | basename }}"

# A release marker alone does not prove that the virtual environment survived
# an interrupted setup or later SD-card damage. Import the core runtime modules
# using the exact interpreter the service will execute.
- name: Check native Linux Voice Assistant runtime
  ansible.builtin.command:
    argv:
      - "{{ smartamp_app_dir }}/linux-voice-assistant/.venv/bin/python"
      - -c
      - "import aioesphomeapi, linux_voice_assistant, mpv, soundcard, websockets"
  args:
    chdir: "{{ smartamp_app_dir }}/linux-voice-assistant"
  register: voice_assistant_runtime
  changed_when: false
  failed_when: false

- name: Determine whether Linux Voice Assistant needs repair
  ansible.builtin.set_fact:
    voice_assistant_needs_setup: >-
      {{
        voice_assistant_checkout.changed
        or not voice_assistant_setup_marker.stat.exists
        or voice_assistant_runtime.rc != 0
      }}

# Upstream's setup script owns creation of .venv and its Python dependencies.
# This is the native/bare-metal client install, not a Home Assistant server.
- name: Install Linux Voice Assistant into its virtual environment
  ansible.builtin.command:
    cmd: script/setup
    chdir: "{{ smartamp_app_dir }}/linux-voice-assistant"
  when: voice_assistant_needs_setup | bool
  notify: Restart voice assistant

# Only write the marker after setup succeeds, so a failed/partial install is
# retried on the next provisioning run.
- name: Record installed Linux Voice Assistant release
  ansible.builtin.file:
    path: "{{ smartamp_app_dir }}/linux-voice-assistant/.smartamp-setup-{{ voice_assistant_version }}"
    state: touch
    owner: root
    group: root
    mode: "0644"
    modification_time: preserve
    access_time: preserve
  when: voice_assistant_needs_setup | bool

# This wrapper leaves the pinned checkout clean while adding the pause/idle
# peripheral events needed for a reliable physical play/pause control, and the
# pipeline abort the upstream stop_pipeline command only half performs.
- name: Install Smart Amp voice media event adapter
  ansible.builtin.copy:
    src: smartamp_lva.py
    dest: "{{ smartamp_app_dir }}/smartamp_lva.py"
    owner: root
    group: root
    mode: "0755"
  notify: Restart voice assistant

# LVA must start after the audio manager has found both required devices. This
# small gate checks the manager's fresh status file and produces a clear systemd
# failure instead of an obscure SoundCard device-lookup exception.
- name: Install voice audio readiness check
  ansible.builtin.copy:
    src: scripts/wait-audio-ready.sh
    dest: "{{ smartamp_app_dir }}/wait-audio-ready.sh"
    owner: root
    group: root
    mode: "0755"
  notify: Restart voice assistant

# Seeed's xvf_host tool talks the XVF3800 vendor-control protocol from the
# command line: reading DSP state and tuning the echo canceller
# (AUDIO_MGR_SYS_DELAY, AUDIO_MGR_REF_GAIN) when voice struggles over music.
# The prebuilt rpi_64bit files are fetched individually rather than cloning
# the repository, which also carries firmware images. Upstream publishes no
# releases or tags, so the pin is a commit plus per-file checksums, both
# generated into vars/main.yml by `make update-versions`. The file set is
# whatever that tool checksummed: xvf_host resolves its companion libraries
# through /proc/self/exe, so they only need to sit beside the real binary.
- name: Create XVF3800 host-control directory
  ansible.builtin.file:
    path: "{{ smartamp_app_dir }}/xvf3800-host-control"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Install XVF3800 host-control tool
  ansible.builtin.get_url:
    url: "https://raw.githubusercontent.com/respeaker/reSpeaker_XVF3800_USB_4MIC_ARRAY/{{ respeaker_host_control_commit }}/host_control/rpi_64bit/{{ item.key }}"
    dest: "{{ smartamp_app_dir }}/xvf3800-host-control/{{ item.key }}"
    checksum: "sha256:{{ item.value }}"
    owner: root
    group: root
    mode: "{{ '0755' if item.key == 'xvf_host' else '0644' }}"
  loop: "{{ respeaker_host_control_checksums | dict2items }}"
  loop_control:
    label: "{{ item.key }}"

# A symlink is enough for PATH convenience because the binary locates its
# libraries from its resolved executable path, not the working directory.
- name: Link xvf_host onto the PATH
  ansible.builtin.file:
    src: "{{ smartamp_app_dir }}/xvf3800-host-control/xvf_host"
    dest: /usr/local/bin/xvf_host
    state: link

# The unit runs under the same account as PipeWire so it can use the private
# audio socket. It exposes an ESPHome voice satellite to HA on the other host.
- name: Install Home Assistant voice service
  ansible.builtin.template:
    src: smartamp-voice-assistant.service.j2
    dest: /etc/systemd/system/smartamp-voice-assistant.service
    owner: root
    group: root
    mode: "0644"
  notify:
    - Reload systemd
    - Restart voice assistant
