---
# Handlers coalesce repeated notifications: several changed files still produce
# one daemon reload or service restart at the end of the play.
- name: Reload systemd
  ansible.builtin.systemd_service:
    daemon_reload: true

# Reloading rules affects future device opens; unplug/replug may still be needed
# if a peripheral was already present before its permission rule was installed.
- name: Reload udev
  ansible.builtin.command: udevadm control --reload-rules
  changed_when: true

# tmpfiles normally applies at boot; apply the new entries now so the
# controller can switch port power without waiting for one.
- name: Apply USB port permissions
  ansible.builtin.command: systemd-tmpfiles --create /etc/tmpfiles.d/smartamp-usb-ports.conf
  changed_when: true

- name: Restart logind
  ansible.builtin.systemd_service:
    name: systemd-logind.service
    state: restarted

- name: Restart journald
  ansible.builtin.systemd_service:
    name: systemd-journald.service
    state: restarted

- name: Reload sysctl
  ansible.builtin.command: sysctl --system -q
  changed_when: true

# The generator materialises the zram device from its configuration at boot, so
# a changed size or algorithm needs the units regenerated before the setup unit
# is restarted. Restarting swaps off first, which the kernel can refuse while
# there is no room to bring those pages back; that is not worth failing a
# provision run over, because the next reboot applies the new size regardless.
- name: Restart zram
  ansible.builtin.systemd_service:
    name: systemd-zram-setup@zram0.service
    state: restarted
    daemon_reload: true
  failed_when: false

# Resource limits are read when the user manager starts, so a changed drop-in
# needs the smartamp session restarted before it takes effect. PipeWire and
# the loopback graph come back on their own: the sockets are enabled for the
# session and the audio manager rebuilds its modules on the next reconcile.
- name: Restart service-account session
  ansible.builtin.systemd_service:
    name: "user@{{ smartamp_uid }}.service"
    state: restarted
    daemon_reload: true

# Re-run the one-shot mixer setup whenever its script or unit changes. This
# applies new ADC routing and amplifier gain immediately instead of waiting for
# the next reboot.
- name: Restart HiFiBerry
  ansible.builtin.systemd_service:
    name: smartamp-hifiberry.service
    state: restarted

- name: Restart audio manager
  ansible.builtin.systemd_service:
    name: smartamp-audio-manager.service
    state: restarted

- name: Restart voice assistant
  ansible.builtin.systemd_service:
    name: smartamp-voice-assistant.service
    state: restarted
  when: voice_assistant_enabled | bool

- name: Restart Sendspin
  ansible.builtin.systemd_service:
    name: smartamp-sendspin.service
    state: restarted
  when: sendspin_enabled | bool

- name: Restart controller
  ansible.builtin.systemd_service:
    name: smartamp-controller.service
    state: restarted
  when: smartamp_controller_enabled | default(false) | bool

# Device-tree overlays and modules-load changes only take effect at boot, so a
# changed hardware configuration needs one controlled reboot before use.
- name: Reboot Smart Amp
  ansible.builtin.reboot:
    msg: "Rebooting to activate Smart Amp boot configuration"
    reboot_timeout: 300
