# Keep PipeWire's hands off the HiFiBerry's hardware mixer (WirePlumber 0.5+,
# Trixie). Without this rule WirePlumber maps sink volume onto the DAC's
# `Digital` ALSA control, and the audio manager pinning the output sink at 100%
# would silently push that control back to 0 dB — defeating the
# hifiberry_output_volume_percent ceiling smartamp-hifiberry.service sets at
# boot. With soft-mixer the sink's volume is applied in PipeWire's own mixing
# and the hardware control stays where the init script put it, which is what
# makes the ceiling a real cap on pops and full-scale transients.
#
# Scoped to platform ALSA outputs only: the HiFiBerry is the sole platform
# card (onboard audio is disabled), and the XVF3800's USB playback endpoint —
# the tuned AEC reference path — must keep its stock volume handling.
#
# WirePlumber 0.4 (Bookworm) does not read wireplumber.conf.d fragments; the
# .lua file deployed beside this one is its equivalent.
monitor.alsa.rules = [
  {
    matches = [
      {
        node.name = "~alsa_output\.platform-.*"
      }
    ]
    actions = {
      update-props = {
        api.alsa.soft-mixer = true
      }
    }
  }
]
