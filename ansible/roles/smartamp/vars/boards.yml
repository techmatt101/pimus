---
# The two hardware axes this recipe supports: which Raspberry Pi is running it,
# and which HiFiBerry board is fitted on top. Both are tables rather than
# conditions spread through the tasks, so no task re-derives "is this a Pi 5" or
# "does this board have an ADC" for itself.
#
# Adding a board means adding a row here and checking the capabilities below are
# true of it, not editing the tasks.

# preflight.yml matches the running board against model_match and publishes the
# winning row as smartamp_board_caps.
smartamp_boards:
  pi5:
    label: "Raspberry Pi 5"
    model_match: "Raspberry Pi 5"
    # The dedicated power button, which arrives as a pwr_button gpio-keys input
    # device. The controller reads it as the sleep/wake toggle, and logind has
    # to be told to leave the key alone; a board without one gets neither.
    power_button: true
    # Whether the board can be a USB sound card to a computer while still
    # hosting the deck and the ReSpeaker. That needs a peripheral-capable port
    # separate from the host ones; a board with a single OTG port can only be
    # one or the other, so preflight refuses usb_audio_gadget_enabled there and
    # audio.json carries no usb route at all.
    usb_gadget: true
    # What the doctor tells you to look at when the throttle flags come back
    # non-zero, since what is worth checking differs by board.
    power_hint: "check AAmp60 and USB power budget"
    # The per-port disable attributes that cut VBUS to the USB-A sockets, and
    # the answer to whether the board can do it at all: an empty list means it
    # cannot, and preflight refuses the sleep power-off flag. On every board
    # that has them the sockets are ganged into one power group, so a write
    # takes every USB-A device down together - which is what this wants, deck and
    # ReSpeaker off as one, but it means nothing else may be left plugged in
    # expecting to survive sleep.
    #
    # The Pi 5's two USB-A connectors and their USB 3 shadow ports, which share
    # each connector's VBUS across four separate root hubs. The root hubs are
    # soldered to the board, so the paths are stable. Ansible grants access to
    # these and the controller writes them; both read this one list.
    usb_port_disables:
      - /sys/bus/usb/devices/usb1/1-0:1.0/usb1-port1/disable
      - /sys/bus/usb/devices/usb2/2-0:1.0/usb2-port1/disable
      - /sys/bus/usb/devices/usb3/3-0:1.0/usb3-port1/disable
      - /sys/bus/usb/devices/usb4/4-0:1.0/usb4-port1/disable
    # Which bootloader EEPROM keys this firmware understands. eeprom.yml writes
    # only these and strips only these, so a key absent here is never staged
    # and never removed from a config someone else set.
    # WAIT_FOR_POWER_BUTTON is documented as flagship-since-Pi-5 only, and
    # PSU_MAX_CURRENT as Pi 5 only.
    eeprom_keys:
      - POWER_OFF_ON_HALT
      - WAKE_ON_GPIO
      - WAIT_FOR_POWER_BUTTON
      - PSU_MAX_CURRENT
  pi4b:
    label: "Raspberry Pi 4 Model B"
    model_match: "Raspberry Pi 4 Model B"
    # No power button of any kind, so a halted board needs WAKE_ON_GPIO (GPIO3
    # or GLOBAL_EN shorted to ground) or a plug cycle to come back; preflight
    # refuses POWER_OFF_ON_HALT here without it. It also means a slept board
    # whose USB power is cut can only be woken by presence: see the note on
    # smartamp_sleep_usb_power_off in inventory.
    power_button: false
    usb_gadget: true
    power_hint: "check AAmp60 and the ~1.2A total USB-A budget; a powered hub may be needed"
    # The VL805 does switch VBUS, but only with firmware 000137ad or newer
    # (sudo rpi-eeprom-update). On older firmware the writes below succeed and
    # nothing goes dark, which is what the doctor's port check is for.
    #
    # Unlike the Pi 5's four one-port root hubs, the Pi 4B's four USB-A sockets
    # are the four ports of one internal hub, present twice: the USB2 side as
    # hub 1-1 and the USB3 side as root hub usb2. A USB 3.0 hub appears as two
    # independent virtual hubs, and power only actually drops when both are
    # switched, so both halves are listed. usb1-port1 is deliberately absent:
    # that port daisy-chains the internal hub itself, and switching a
    # daisy-chain port confuses the hub circuitry.
    usb_port_disables:
      - /sys/bus/usb/devices/1-1/1-1:1.0/1-1-port1/disable
      - /sys/bus/usb/devices/1-1/1-1:1.0/1-1-port2/disable
      - /sys/bus/usb/devices/1-1/1-1:1.0/1-1-port3/disable
      - /sys/bus/usb/devices/1-1/1-1:1.0/1-1-port4/disable
      - /sys/bus/usb/devices/usb2/2-0:1.0/usb2-port1/disable
      - /sys/bus/usb/devices/usb2/2-0:1.0/usb2-port2/disable
      - /sys/bus/usb/devices/usb2/2-0:1.0/usb2-port3/disable
      - /sys/bus/usb/devices/usb2/2-0:1.0/usb2-port4/disable
    # The Pi 4B bootloader has no WAIT_FOR_POWER_BUTTON and no PSU_MAX_CURRENT:
    # its USB-A budget is fixed in hardware at roughly 1.2A total, with no
    # supply to declare.
    eeprom_keys:
      - POWER_OFF_ON_HALT
      - WAKE_ON_GPIO
  pizero2w:
    label: "Raspberry Pi Zero 2 W"
    model_match: "Raspberry Pi Zero 2 W"
    # No power button and no USB-A sockets at all: one micro-USB OTG port for
    # data beside the one that only takes power. Everything - the deck, the
    # ReSpeaker, and any Ethernet adapter - reaches the Pi through a powered hub
    # on that single port.
    power_button: false
    # Host and peripheral are the same port here, so being a USB sound card
    # would mean unplugging the hub the deck and the ReSpeaker hang off. The
    # deck's USB key greys itself out on the route list that follows.
    usb_gadget: false
    power_hint: "the hub must be self-powered; this board cannot feed the deck and ReSpeaker itself"
    # Nothing to switch. The OTG port's VBUS comes straight off the 5V rail with
    # no switch in the path, and the devices are on a self-powered hub anyway -
    # disabling the root port would drop them off the bus without saving a watt.
    usb_port_disables: []
    # A BCM2710 boots bootcode.bin from the SD card: there is no bootloader
    # EEPROM on this board, and no rpi-eeprom-config to read. An empty list is
    # what skips that task entirely (tasks/main.yml) and what makes preflight
    # name any power flag that is on. Halting leaves the board's rails up, so
    # the ~0W floor POWER_OFF_ON_HALT buys elsewhere is not available here.
    eeprom_keys: []

# The HiFiBerry board fitted on the header, chosen by hifiberry_board in
# inventory because a HAT cannot be detected once force_eeprom_read=0 tells the
# firmware to ignore its EEPROM (see tasks/audio.yml). preflight.yml publishes
# the chosen row as smartamp_hifiberry_caps.
#
# Both boards present the same ALSA card id: their card names differ
# (snd_rpi_hifiberry_dacplusadcpro against snd_rpi_hifiberry_dacplus) but ALSA
# strips the underscores and truncates to fifteen characters, which leaves
# sndrpihifiberry either way. That is why the card name is one inventory value
# rather than a property of the row.
smartamp_hifiberry_boards:
  dac2adcpro:
    label: "HiFiBerry DAC2 ADC Pro"
    overlay: hifiberry-dacplusadcpro
    # A PCM1863 ADC alongside the DAC, which is what makes the analogue line-in
    # a capture device and gives the card its ADC mixer controls. Without one
    # there is no aux route to switch and no gain to set, so preflight refuses
    # smartamp_aux_enabled and audio.json carries no aux source at all.
    aux_input: true
    # Whether the board has an amplifier with a hardware mute line the overlay
    # can drive. The DAC2 ADC Pro is a DAC: the AAmp60 bolted to it is a plain
    # analogue amplifier the Pi has no control over.
    amplifier_mute: false
  amp100:
    label: "HiFiBerry Amp100"
    overlay: hifiberry-amp100
    # An amplifier with its own DAC and no ADC whatsoever.
    aux_input: false
    # The overlay drives a mute GPIO, and its auto_mute parameter ties that to
    # the PCM stream opening and closing - so the amplifier is muted whenever
    # nothing is playing, which is what silences its idle hiss. Turned on by
    # hifiberry_auto_mute in inventory.
    amplifier_mute: true
